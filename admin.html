<div class="admin-login-card">
    <h1>Panel Admin</h1>

    <p>Furioz-Compagnie • Accès sécurisé</p>

    <form id="loginForm">
        <label for="user">Utilisateur</label>
        <input
            type="text"
            id="user"
            name="user"
            autocomplete="username"
            required
        >

        <label for="pass">Mot de passe</label>
        <input
            type="password"
            id="pass"
            name="pass"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Se connecter
        </button>

        <p id="loginError"></p>
    </form>
</div>

<script>
const loginForm = document.getElementById("loginForm");
const loginError = document.getElementById("loginError");

loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    loginError.textContent = "";

    const user = document.getElementById("user").value.trim();
    const pass = document.getElementById("pass").value;

    try {
        const response = await fetch("/api/admin-login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                user,
                pass
            })
        });

        const data = await response.json();

        if (!response.ok) {
            loginError.textContent =
                data.error || "Identifiant ou mot de passe incorrect.";
            return;
        }

        if (!data.token) {
            loginError.textContent =
                "Erreur : aucun jeton de connexion reçu.";
            return;
        }

        sessionStorage.setItem("adminToken", data.token);

        // Affiche le panel admin
        document.body.classList.add("admin-connected");

        // Si tu as déjà une fonction pour afficher le panel :
        if (typeof showAdminPanel === "function") {
            showAdminPanel();
        }

    } catch (error) {
        console.error(error);
        loginError.textContent =
            "Impossible de contacter le serveur.";
    }
});
</script>
