<!doctype html>
<html lang="fr">

<head>

<link rel="icon" type="image/png" href="img/logo.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin - Furioz Compagnie</title>

<meta name="robots" content="noindex, nofollow">

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="css/style.css">

<style>

/* =========================================================
   BASE ADMIN
   ========================================================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#F3F0E9;
  color:#0F172A;
}

.login-wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:1rem;
}

.card{
  background:#fff;
  border:1px solid #E2E8F0;
  border-radius:12px;
  padding:1.5rem;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
  width:min(380px,92vw);
}

.card h1{
  margin:0 0 .2rem;
  font-size:1.2rem;
}

.muted{
  color:#64748B;
  font-size:.85rem;
}


/* =========================================================
   CHAMPS
   CORRECTION TEXTE INVISIBLE
   ========================================================= */

input,
textarea,
select{
  color:#111827 !important;
  -webkit-text-fill-color:#111827 !important;

  background:#fff !important;

  border:1px solid #CBD5E1;
  border-radius:10px;

  font-family:Inter,system-ui,sans-serif;
  font-size:.9rem;

  box-sizing:border-box;
}

input{
  width:100%;
  padding:.6rem .8rem;
  margin-top:.4rem;
}

textarea,
select{
  width:100%;
}

input::placeholder,
textarea::placeholder{
  color:#94A3B8 !important;
  -webkit-text-fill-color:#94A3B8 !important;
  opacity:1;
}

input:focus,
textarea:focus,
select:focus{
  color:#111827 !important;
  -webkit-text-fill-color:#111827 !important;
  background:#fff !important;

  border-color:#2563EB !important;
  outline:2px solid rgba(37,99,235,.14);
}

input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus{
  -webkit-text-fill-color:#111827 !important;
  box-shadow:0 0 0 1000px #fff inset !important;
}


/* =========================================================
   BOUTONS
   ========================================================= */

.btn{
  border:0;
  border-radius:10px;

  padding:.6rem 1rem;

  font-weight:600;
  cursor:pointer;
  font-size:.9rem;

  background:#0F172A;
  color:#fff !important;

  width:100%;
  margin-top:.8rem;

  -webkit-text-fill-color:#fff !important;
}

.btn:hover{
  background:#1E293B;
}


/* =========================================================
   HEADER ADMIN
   ========================================================= */

.header{
  height:56px;

  background:#fff;
  border-bottom:1px solid #E2E8F0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 1.2rem;

  position:sticky;
  top:0;
  z-index:10;
}


/* =========================================================
   STATISTIQUES
   ========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:.8rem;
  margin:1rem 0;
}

.stat{
  background:#fff;

  border:1px solid #E2E8F0;
  border-radius:12px;

  padding:1rem;
}

.stat b{
  font-size:1.4rem;
  display:block;
}


/* =========================================================
   ONGLETS
   ========================================================= */

.tabs{
  display:flex;
  gap:.4rem;

  margin:1rem 0;

  flex-wrap:wrap;
}

.tab{
  padding:.4rem .8rem;

  border-radius:999px;
  border:1px solid #E2E8F0;

  background:#fff;

  cursor:pointer;

  font-weight:600;
  font-size:.8rem;

  color:#0F172A;
}

.tab.active{
  background:#0F172A;
  color:#fff;
  border-color:#0F172A;
}


/* =========================================================
   TABLEAUX
   ========================================================= */

.table-wrap{
  background:#fff;

  border:1px solid #E2E8F0;
  border-radius:12px;

  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:.8rem;
}

th{
  text-align:left;

  padding:.6rem;

  background:#F8FAFC;

  border-bottom:1px solid #E2E8F0;

  font-size:.7rem;

  text-transform:uppercase;
  letter-spacing:.05em;
}

td{
  padding:.6rem;

  border-bottom:1px solid #F1F5F9;

  vertical-align:top;
}


/* =========================================================
   BADGES
   ========================================================= */

.badge{
  display:inline-flex;

  padding:.15rem .4rem;

  border-radius:999px;

  font-size:.65rem;
  font-weight:700;
}

.badge-red{
  background:#FEE2E2;
  color:#991B1B;
}

.badge-blue{
  background:#DBEAFE;
  color:#1E40AF;
}

.badge-green{
  background:#DCFCE7;
  color:#166534;
}


/* =========================================================
   ÉQUIPE ADMIN
   ========================================================= */

.team-admin-box{
  background:#fff;

  border:1px solid #E2E8F0;
  border-radius:12px;

  padding:1rem;
}

.team-form-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:.8rem;
}

.team-form-grid label{
  display:flex;
  flex-direction:column;

  gap:.35rem;

  font-size:.75rem;
  font-weight:700;

  color:#334155 !important;

  -webkit-text-fill-color:#334155 !important;
}


/* TOUS LES CHAMPS TEAM */

.team-form-grid input:not([type="checkbox"]):not([type="color"]),
.team-form-grid textarea,
.team-form-grid select{
  width:100%;

  min-height:42px;

  padding:.58rem .7rem;

  margin:0;

  border:1px solid #CBD5E1;
  border-radius:9px;

  font:inherit;

  color:#111827 !important;
  -webkit-text-fill-color:#111827 !important;

  background:#fff !important;
}


/* SELECT */

.team-form-grid select{
  appearance:auto;
}


/* OPTIONS */

.team-form-grid option{
  color:#111827;
  background:#fff;
}


/* TEXTAREA */

.team-form-grid textarea{
  min-height:110px;
  resize:vertical;
}


/* GRANDE LIGNE */

.team-form-full{
  grid-column:1/-1;
}


/* =========================================================
   COULEUR AVATAR
   ========================================================= */

.team-color-row{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:.75rem;
}

.team-color-group{
  display:grid;
  grid-template-columns:58px 1fr;
  gap:.5rem;
  align-items:center;
}

.team-color-group small{
  grid-column:1/-1;
  color:#64748B;
  font-weight:600;
}

#tm-color,
#tm-color2{
  width:58px !important;
  min-width:58px !important;
  height:42px;
  margin:0;
  padding:3px;
  border:1px solid #CBD5E1;
  border-radius:9px;
  background:#fff !important;
  cursor:pointer;
}

#tm-color-text,
#tm-color2-text{
  width:100%;
  margin:0;
  color:#111827 !important;
  -webkit-text-fill-color:#111827 !important;
  background:#fff !important;
}

@media(max-width:700px){
  .team-color-row{
    grid-template-columns:1fr;
  }
}


/* =========================================================
   CHECKBOX
   ========================================================= */

.team-visible-label{
  display:flex !important;

  flex-direction:row !important;

  align-items:center !important;

  gap:.5rem !important;
}

#tm-visible{
  width:18px !important;
  height:18px !important;

  min-height:auto !important;

  padding:0 !important;
  margin:0 !important;

  accent-color:#2563EB;
}


/* =========================================================
   LISTE MEMBRES ADMIN
   ========================================================= */

.team-admin-list{
  display:grid;

  gap:.6rem;

  margin-top:1rem;
}

.team-admin-row{
  display:flex;

  justify-content:space-between;

  gap:1rem;

  align-items:center;

  border:1px solid #E2E8F0;
  border-radius:10px;

  padding:.7rem;

  background:#fff;
}

.team-admin-actions{
  display:flex;

  gap:.4rem;

  flex-wrap:wrap;
}

.mini-btn{
  border:1px solid #CBD5E1;

  background:#fff;

  color:#111827;

  border-radius:8px;

  padding:.35rem .55rem;

  cursor:pointer;

  font-weight:600;
}

.mini-btn.danger{
  border-color:#FECACA;

  background:#FEF2F2;

  color:#991B1B;
}


/* =========================================================
   MENU PRINCIPAL
   ========================================================= */

#main-nav{
  display:flex !important;

  align-items:center !important;

  justify-content:space-between !important;

  flex-wrap:nowrap !important;

  gap:18px !important;
}

#main-nav .brand{
  flex:0 0 auto !important;

  white-space:nowrap !important;
}

#main-nav .links{
  display:flex !important;

  align-items:center !important;

  justify-content:flex-end !important;

  flex-wrap:nowrap !important;

  gap:.3rem !important;

  min-width:0 !important;
}

#main-nav .links a{
  flex:0 0 auto !important;

  white-space:nowrap !important;

  word-break:keep-all !important;

  overflow-wrap:normal !important;

  writing-mode:horizontal-tb !important;

  width:auto !important;

  min-width:auto !important;
  max-width:none !important;

  margin-top:0 !important;

  line-height:1.2 !important;
}

#main-nav .links .btn,
#main-nav .links .btn-discord{
  width:auto !important;

  min-width:auto !important;

  display:inline-flex !important;

  padding:.6rem 1.1rem !important;

  margin:0 !important;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:1100px) and (min-width:901px){

  #main-nav{
    padding-left:2vw !important;
    padding-right:2vw !important;

    gap:10px !important;
  }

  #main-nav .links{
    gap:.12rem !important;
  }

  #main-nav .links a{
    padding:.4rem .55rem !important;

    font-size:.8rem !important;
  }

  #main-nav .brand strong{
    font-size:.9rem !important;
  }
}

@media(max-width:900px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  #main-nav .links a:not(.btn){
    display:none !important;
  }
}

@media(max-width:700px){

  .team-form-grid{
    grid-template-columns:1fr;
  }

  .team-form-full{
    grid-column:auto;
  }

  .team-admin-row{
    align-items:flex-start;

    flex-direction:column;
  }
}

</style>

</head>


<body>


<!-- ======================================================
     MENU
     ====================================================== -->

<nav id="main-nav">

  <a
    href="index.html#accueil"
    class="brand"
    id="logo-link"
  >

    <img
      src="img/furioz-logo.png"
      alt="Furioz"
    >

    <strong>
      FURIOZ COMPAGNIE
    </strong>

  </a>


  <div class="links">

    <a href="index.html#accueil">
      Accueil
    </a>

    <a href="index.html#qui">
      Le projet
    </a>

    <a href="index.html#team">
      Équipe
    </a>

    <a href="index.html#rejoindre">
      Rejoindre
    </a>

    <a href="livre-dor.html">
      Livre d’or
    </a>

    <a
      href="admin.html"
      class="nav-link admin-link active"
    >
      Admin
    </a>

    <a
      href="https://discord.gg/nKj9NFDyxj"
      target="_blank"
      class="btn btn-discord"
    >
      Discord
    </a>

  </div>

</nav>


<!-- ======================================================
     CONNEXION
     ====================================================== -->

<div
  id="login"
  class="login-wrap"
>

  <div class="card">

    <h1>
      Panel Admin
    </h1>

    <p class="muted">
      Furioz-Compagnie • Accès sécurisé
    </p>


    <div style="margin-top:1rem">

      <label
        style="
          font-size:.8rem;
          font-weight:600
        "
      >
        Utilisateur
      </label>

      <input
        id="user"
        type="text"
        autocomplete="username"
      >

    </div>


    <div style="margin-top:.6rem">

      <label
        style="
          font-size:.8rem;
          font-weight:600
        "
      >
        Mot de passe
      </label>

      <input
        id="pass"
        type="password"
        autocomplete="current-password"
      >

    </div>


    <button
      class="btn"
      id="loginBtn"
    >
      Se connecter
    </button>


    <div
      id="loginMsg"

      style="
        margin-top:.6rem;
        font-size:.8rem
      "
    ></div>

  </div>

</div>


<!-- ======================================================
     DASHBOARD
     ====================================================== -->

<div
  id="dash"
  style="display:none"
>

  <div class="header">

    <div
      style="
        display:flex;
        align-items:center;
        gap:.6rem
      "
    >

      <strong>
        Panel Admin
      </strong>

      <span
        id="userInfo"

        style="
          font-size:.75rem;
          background:#F1F5F9;
          padding:.2rem .5rem;
          border-radius:999px
        "
      ></span>

      <span
        id="serverTime"

        style="
          font-size:.7rem;
          color:#64748B
        "
      ></span>

    </div>


    <div
      style="
        display:flex;
        gap:.5rem
      "
    >

      <a
        href="index.html"

        style="
          text-decoration:none;
          font-size:.8rem;
          padding:.4rem .7rem;
          border:1px solid #E2E8F0;
          border-radius:999px;
          background:#fff;
          color:#0F172A
        "
      >
        Retour site
      </a>


      <button
        id="logout"

        style="
          font-size:.8rem;
          padding:.4rem .7rem;
          border:1px solid #E2E8F0;
          border-radius:999px;
          background:#fff;
          cursor:pointer
        "
      >
        Déconnexion
      </button>

    </div>

  </div>


  <div
    style="
      width:min(1100px,94vw);
      margin:0 auto;
      padding:1rem 0 3rem
    "
  >

    <div
      class="stats"
      id="stats"
    ></div>

    <div
      id="redis-status"
      style="
        margin:.65rem 0 1rem;
        padding:.7rem .9rem;
        border-radius:10px;
        font-size:.8rem;
        font-weight:700;
        display:none
      "
    ></div>


    <div
      style="
        display:flex;
        gap:.5rem;
        margin-bottom:.5rem
      "
    >

      <button
        class="btn"
        style="width:auto"
        id="refresh"
      >
        Rafraîchir
      </button>

    </div>


    <div class="tabs">

      <div
        class="tab active"
        data-t="visits"
      >
        Visites
      </div>

      <div
        class="tab"
        data-t="intrusions"
      >
        Intrusions (hackers)
      </div>

      <div
        class="tab"
        data-t="guestbook"
      >
        Livre d'or
      </div>

      <div
        class="tab"
        data-t="countries"
      >
        Pays
      </div>

      <div
        class="tab"
        data-t="team"
      >
        Équipe
      </div>

    </div>


    <div id="content"></div>

  </div>

</div>


<script>

/* =========================================================
   API
   ========================================================= */

const API_LOGIN =
  '/api/admin-login';

const API_STATS =
  '/api/admin-stats';

const API_GB =
  '/api/guestbook';

const API_TEAM =
  '/api/team';


let token =
  localStorage.getItem(
    'furioz_token'
  );


/* =========================================================
   CONNEXION
   ========================================================= */

function showLogin(){

  document
    .getElementById('login')
    .style.display =
      'grid';

  document
    .getElementById('dash')
    .style.display =
      'none';
}


function showDash(){

  document
    .getElementById('login')
    .style.display =
      'none';

  document
    .getElementById('dash')
    .style.display =
      'block';

  loadStats();
}


if(token){

  showDash();

}
else{

  showLogin();

}


document
  .getElementById(
    'loginBtn'
  )
  .onclick =
  async()=>{

    const user =
      document
        .getElementById(
          'user'
        )
        .value
        .trim();

    const pass =
      document
        .getElementById(
          'pass'
        )
        .value;


    const msg =
      document
        .getElementById(
          'loginMsg'
        );


    if(
      !user ||
      !pass
    ){

      msg.textContent =
        'Entrez votre utilisateur et votre mot de passe.';

      msg.style.color =
        '#DC2626';

      return;
    }


    msg.textContent =
      'Connexion...';

    msg.style.color =
      '#334155';


    try{

      const r =
        await fetch(
          API_LOGIN,
          {
            method:'POST',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify({
                username:user,
                password:pass,
                user:user,
                pass:pass
              })
          }
        );


      const contentType =
        r.headers.get(
          'content-type'
        ) || '';


      let j = {};


      if(
        contentType.includes(
          'application/json'
        )
      ){

        j =
          await r.json();

      }


      if(!r.ok){

        msg.textContent =
          j.error ||
          `Erreur connexion (${r.status})`;

        msg.style.color =
          '#DC2626';

        return;
      }


      token =
        j.token;


      localStorage.setItem(
        'furioz_token',
        token
      );


      localStorage.setItem(
        'furioz_user',
        j.user ||
        user
      );


      showDash();

    }

    catch(error){

      console.error(
        error
      );


      msg.textContent =
        'Erreur réseau';

      msg.style.color =
        '#DC2626';

    }

  };


document
  .getElementById(
    'pass'
  )
  .addEventListener(
    'keydown',
    event=>{

      if(
        event.key ===
        'Enter'
      ){

        document
          .getElementById(
            'loginBtn'
          )
          .click();

      }

    }
  );


document
  .getElementById(
    'logout'
  )
  .onclick =
  ()=>{

    localStorage
      .removeItem(
        'furioz_token'
      );


    token =
      null;


    showLogin();

  };


/* =========================================================
   ONGLETS
   ========================================================= */

let currentTab =
  'visits';


let cache =
  null;


document
  .querySelectorAll(
    '.tab'
  )
  .forEach(
    tab=>{

      tab.onclick =
        ()=>{

          document
            .querySelectorAll(
              '.tab'
            )
            .forEach(
              x=>
                x.classList.remove(
                  'active'
                )
            );


          tab.classList.add(
            'active'
          );


          currentTab =
            tab.dataset.t;


          render();

        };

    }
  );


document
  .getElementById(
    'refresh'
  )
  .onclick =
    loadStats;


/* =========================================================
   STATS
   ========================================================= */

async function loadStats(){

  try{

    const r =
      await fetch(
        API_STATS,
        {
          headers:{
            Authorization:
              `Bearer ${token}`
          }
        }
      );


    if(
      r.status ===
      401
    ){

      localStorage
        .removeItem(
          'furioz_token'
        );

      showLogin();

      return;
    }


    const data =
      await r.json();


    cache =
      data;


    const redisBox =
      document.getElementById(
        'redis-status'
      );

    if(redisBox){

      const rs =
        data.redisStatus ||
        {};

      redisBox.style.display =
        'block';

      if(
        data.storage === 'redis' &&
        rs.connected
      ){

        redisBox.style.background =
          '#DCFCE7';

        redisBox.style.color =
          '#166534';

        redisBox.style.border =
          '1px solid #86EFAC';

        redisBox.textContent =
          `Stockage : Redis connecté ✅ (${rs.variable || 'REDIS_URL'})`;

      }

      else if(
        data.storage === 'redis-error' ||
        (
          rs.configured &&
          !rs.connected
        )
      ){

        redisBox.style.background =
          '#FEE2E2';

        redisBox.style.color =
          '#991B1B';

        redisBox.style.border =
          '1px solid #FCA5A5';

        redisBox.textContent =
          `Stockage : Redis en erreur ❌ — ${rs.message || 'Connexion impossible'}`;

      }

      else{

        redisBox.style.background =
          '#FEF3C7';

        redisBox.style.color =
          '#92400E';

        redisBox.style.border =
          '1px solid #FCD34D';

        redisBox.textContent =
          'Stockage : Mémoire temporaire ⚠️ Redis non connecté';

      }

    }


    document
      .getElementById(
        'userInfo'
      )
      .textContent =
        localStorage
          .getItem(
            'furioz_user'
          ) ||
        'admin';


    document
      .getElementById(
        'serverTime'
      )
      .textContent =
        new Date(
          data.serverTime
        )
          .toLocaleString(
            'fr-FR'
          );


    document
      .getElementById(
        'stats'
      )
      .innerHTML = `

        <div class="stat">

          <span
            class="muted"
            style="font-size:.7rem"
          >
            TOTAL VISITES
          </span>

          <b>
            ${data.stats.totalVisits}
          </b>

          <span
            class="muted"
            style="font-size:.7rem"
          >
            ${data.storage === 'redis'
              ? 'Données persistantes Redis'
              : 'Logs en mémoire (max 1000)'}
          </span>

        </div>


        <div class="stat">

          <span
            class="muted"
            style="font-size:.7rem"
          >
            VISITES 24H
          </span>

          <b>
            ${data.stats.visits24h}
          </b>

        </div>


        <div class="stat">

          <span
            class="muted"
            style="font-size:.7rem"
          >

async function del(id){

  if(
    !confirm(
      'Supprimer cet avis ?'
    )
  ){
    return;
  }


  const r =
    await fetch(
      `${API_GB}?id=${encodeURIComponent(id)}`,
      {
        method:'DELETE',

        headers:{
          Authorization:
            `Bearer ${token}`
        }
      }
    );


  if(r.ok){

    loadStats();

    render();

  }

  else{

    alert(
      'Erreur suppression'
    );

  }

}

let teamAdminCache =
  [];


/* =========================================================
   ÉCHAPPEMENT
   ========================================================= */

function teamEsc(value){

  return String(
    value ??
    ''
  )

    .replaceAll(
      '&',
      '&amp;'
    )

    .replaceAll(
      '<',
      '&lt;'
    )

    .replaceAll(
      '>',
      '&gt;'
    )

    .replaceAll(
      '"',
      '&quot;'
    )

    .replaceAll(
      "'",
      '&#039;'
    );

}

   CHARGER TEAM
   ========================================================= */

async function fetchTeamAdmin(){

  const r =
    await fetch(
      API_TEAM,
      {
        cache:
          'no-store'
      }
    );


  const contentType =
    r.headers.get(
      'content-type'
    ) || '';


  if(!r.ok){

    let message =
      `Erreur API équipe (${r.status})`;


    if(
      contentType.includes(
        'application/json'
      )
    ){

      try{

        const errorData =
          await r.json();


        if(
          errorData &&
          errorData.error
        ){

          message =
            errorData.error;

        }

      }

      catch{}

    }


    throw new Error(
      message
    );

  }


  if(
    !contentType.includes(
      'application/json'
    )
  ){

    throw new Error(
      "L’API équipe ne renvoie pas du JSON."
    );

  }


  const data =
    await r.json();


  if(
    !Array.isArray(
      data
    )
  ){

    throw new Error(
      'Réponse équipe invalide.'
    );

  }


  teamAdminCache =
    data;


  return data;

}

/* =========================================================

   ========================================================= */

function initTeamColorControls(){

  const pairs = [
    ['tm-color', 'tm-color-text'],
    ['tm-color2', 'tm-color2-text']
  ];

  pairs.forEach(
    ([pickerId, textId])=>{

      const picker =
        document.getElementById(
          pickerId
        );

      const text =
        document.getElementById(
          textId
        );

      if(
        !picker ||
        !text
      ){
        return;
      }

      picker.addEventListener(
        'input',
        ()=>{

          text.value =
            picker.value;

        }
      );

      text.addEventListener(
        'input',
        ()=>{

          const value =
            text.value.trim();

          if(
            /^#[0-9A-Fa-f]{6}$/.test(
              value
            )
          ){

            picker.value =
              value;

          }

        }
      );

    }
  );

}

function editTeamMember(id){

  const member =
    teamAdminCache
      .find(
        item=>
          item.id ===
          id
      );


  if(!member){
    return;
  }


  document
    .getElementById(
      'tm-id'
    )
    .value =
      member.id || '';


  document
    .getElementById(
      'tm-name'
    )
    .value =
      member.name || '';


  const status =
    document
      .getElementById(
        'tm-status'
      );


  if(
    status &&
    !Array.from(
      status.options
    )
      .some(
        option=>
          option.value ===
          member.status
      )
  ){

    const option =
      document
        .createElement(
          'option'
        );


    option.value =
      member.status;


    option.textContent =
      member.status;


    status.appendChild(
      option
    );

  }


  status.value =
    member.status ||
    'MEMBRE';


  document
    .getElementById(
      'tm-country'
    )
    .value =
      member.country || '';


  document
    .getElementById(
      'tm-flag'
    )
    .value =
      member.countryFlag || '';


  document
    .getElementById(
      'tm-joined'
    )
    .value =
      member.joined || '';


  document
    .getElementById(
      'tm-stream'
    )
    .value =
      member.streamSince || '';


  document
    .getElementById(
      'tm-role'
    )
    .value =
      member.role || '';


  document
    .getElementById(
      'tm-category'
    )
    .value =
      member.category || '';


  document
    .getElementById(
      'tm-initial'
    )
    .value =
      member.initial || '';


  const memberColor =
    /^#[0-9A-Fa-f]{6}$/.test(
      member.color ||

        .value
        .split(',')
        .map(
          item=>
            item.trim()
        )
        .filter(
          Boolean
        ),

    twitch:
      document
        .getElementById(
          'tm-twitch'
        )
        .value
        .trim(),

    youtube:
      document
        .getElementById(
          'tm-youtube'
        )
        .value
        .trim(),

    discord:
      document
        .getElementById(
          'tm-discord'
        )
        .value
        .trim(),

    visible:
      document
        .getElementById(
          'tm-visible'
        )
        .checked

  };


  const msg =
    document
      .getElementById(
        'team-admin-msg'
      );


  if(
    !body.name
  ){

    msg.style.color =
      '#991B1B';

    msg.textContent =
      'Nom obligatoire.';

    return;

  }


  msg.style.color =
    '#334155';

  msg.textContent =
    'Sauvegarde...';


  try{

    const r =
      await fetch(
        API_TEAM,
        {
          method:
            id
              ?
              'PUT'
              :
              'POST',

          headers:{
            'Content-Type':
              'application/json',

            Authorization:
              `Bearer ${token}`
          },

          body:
            JSON.stringify(
              body
            )
        }
      );


    const contentType =
      r.headers.get(
        'content-type'
      ) || '';


    let data = {};


    if(
      contentType.includes(
        'application/json'
      )
    ){

      try{

        data =
          await r.json();

      }

      catch{}

    }


    if(!r.ok){

      msg.style.color =
        '#991B1B';

      msg.textContent =
        data.error ||
        `Erreur API équipe (${r.status})`;

      return;

    }


    msg.style.color =
      '#166534';

    msg.textContent =
      id
        ?
        'Membre modifié.'
        :
        'Membre ajouté.';


    await renderTeamAdmin();

  }

  catch(error){

    console.error(
      error
    );


    msg.style.color =
      '#991B1B';

    msg.textContent =
      'Erreur réseau.';

  }

}


/* =========================================================
   SUPPRIMER TEAM
   ========================================================= */

async function deleteTeamMember(id){

  const member =
    teamAdminCache
      .find(
        item=>
          item.id ===
          id
      );


  if(
    !confirm(
      `Supprimer ${
        member?.name ||
        id
      } ?`
    )
  ){

    return;

  }


  try{

    const r =
      await fetch(
        `${API_TEAM}?id=${encodeURIComponent(id)}`,
        {
          method:
            'DELETE',

          headers:{
            Authorization:
              `Bearer ${token}`
          }
        }
      );


    const contentType =
      r.headers.get(
        'content-type'
      ) || '';


    let data = {};


    if(
      contentType.includes(
        'application/json'
      )
    ){

      try{

        data =
          await r.json();

      }

      catch{}

    }


    if(!r.ok){

      alert(
        data.error ||
        `Erreur suppression (${r.status})`
      );

      return;

    }


    await renderTeamAdmin();

  }

  catch(error){

    console.error(
      error
    );


    alert(
      'Erreur réseau pendant la suppression.'
    );

  }

}
